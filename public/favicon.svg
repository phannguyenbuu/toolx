<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tech-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="tech-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean, crisp white background rounded squircle -->
  <rect x="3" y="3" width="94" height="94" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#soft-shadow)" />

  <!-- Subtle tech ring from ToolXPrintLogo -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="50" cy="50" r="28" fill="none" stroke="#fdf4ff" stroke-width="2" />

  <!-- ToolX Bold Futuristic 'X' Marks -->
  <path d="M26 26 L74 74" stroke="url(#tech-grad-1)" stroke-width="14" stroke-linecap="round" />
  <path d="M74 26 L26 74" stroke="url(#tech-grad-2)" stroke-width="14" stroke-linecap="round" />

  <!-- Center Diamond & Tech Core -->
  <rect x="42" y="42" width="16" height="16" transform="rotate(45 50 50)" fill="#ffffff" stroke="#c084fc" stroke-width="2" />
  <rect x="45" y="45" width="10" height="10" transform="rotate(45 50 50)" fill="#d946ef" />

  <!-- 4 Terminal Satellites -->
  <circle cx="26" cy="26" r="4" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="74" cy="74" r="4" fill="#ec4899" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="74" cy="26" r="4" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="26" cy="74" r="4" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />
</svg>